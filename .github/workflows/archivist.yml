# Archivist
#
# brief-validation moved: the Brief Validation PR gate now runs as step 9/9 of
#   the consolidated "AEG gate suite" job in forge-lifecycle.yml
#   (aeg-governance-hardening task 31, #395, item 3 — per-job billing overhead).
#   Same gate, same strictness, different packaging. This workflow no longer
#   triggers on pull_request at all.
#
# post-merge: Triggered after merge to main. Resolves the merge commit's PR, assembles
#   and posts the per-task Archivist provenance block, and explicitly closes the task's
#   Issue — the mechanical close-out obligations from `roles/archivist.md` items
#   1 and 8. Idempotent per PR (skips if a provenance comment already exists) and skips
#   non-task branches. See packages/aeg-core/src/archive-task.ts.
#
# daily-drift: Runs on schedule (or manually via workflow_dispatch). Runs the
#   dead-branch-push audit (aeg-governance-hardening task 24, #364, Part 4 —
#   item 2): flags any remote `task/*` branch whose tip commit lands after its
#   own PR already resolved (merged/closed) — the "six topology rows landed on
#   a merged plan PR's branch" incident class (2026-07-03), caught within a day
#   instead of never. Never fails red — a notification channel (label +
#   idempotent tracking comment on the branch's own resolved PR), not a merge
#   gate. See packages/aeg-core/src/dead-branch-push-audit.ts.
#   (2026-07-13: this job previously also ran a stuck row-adjacent-
#   blocker check, `stale-blocker.ts` — retired along with the dispatch-gate
#   predicate it watched for, which that change removed. Re-scoping it to watch
#   Depends-on/Conflicts-with staleness instead would require a new
#   staleness-duration signal `dispatch-gate.ts` doesn't already compute —
#   out of that decision's scope, so the job step was retired rather than
#   re-purposed.)
#
# direct-main-push-detection: Runs on every push to `main` (aeg-governance-hardening
#   task 24, #364, Part 3 — item 1). Prevention lives in `.husky/pre-push` (ring 0)
#   and the repository ruleset's `non_fast_forward`/`pull_request` rules (ring 1);
#   this job is the ring-2 backstop that DETECTS a direct push after the fact via the
#   commits→pulls association API and fails the run loudly. Detection only,
#   never mutation — no revert, no force-push. Permissions are deliberately
#   read-only plus `issues: write`: `pull-requests: read` is REQUIRED for the
#   commits→pulls association API the check calls — without it the job 403s
#   ("Resource not accessible by integration") on every real main push
#   (aeg-governance-hardening task 31, #395, item 2). Also runs on
#   workflow_dispatch so the check is triggerable on demand for verification
#   (github.sha is then the selected branch's tip — a PR merge commit on main
#   yields a green run). See packages/aeg-core/src/direct-main-push.ts.

name: "Vinaya: Archivist"

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"  # daily at 02:00 UTC
  workflow_dispatch:

jobs:
  post-merge:
    name: Post-Merge Archivist
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run archive-task
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_SHA: ${{ github.sha }}
        run: bun packages/aeg-core/bin/archive-task.ts

  daily-drift:
    name: Daily Drift Check (dead-branch pushes)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run dead-branch-audit
        continue-on-error: true # never-red — this job is a notification channel, not a gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun packages/aeg-core/bin/dead-branch-audit.ts

  direct-main-push-detection:
    name: Direct-Main-Push Detection
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check commit is introduced by a merged PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: bun packages/aeg-core/bin/check-direct-main-push.ts
