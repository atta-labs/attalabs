# Archivist
#
# brief-validation: Real, CI-enforced gate (D-069) — checks the PR body carries every
#   required brief section (Tier, Test Plan, surface map, doc-update list, worktree
#   Step 0, stop conditions, autonomy clause, Closes #N, lock-ack). Blocks merge when
#   validation fails and applies `needs:brief-correction`. See
#   packages/aeg-core/src/brief-validation.ts.
#
# post-merge: Triggered after merge to main. Resolves the merge commit's PR, assembles
#   and posts the per-task Archivist provenance block, and explicitly closes the task's
#   Issue (D-056) — the mechanical close-out obligations from `roles/archivist.md` items
#   1 and 8. Idempotent per PR (skips if a provenance comment already exists) and skips
#   non-task branches. See packages/aeg-core/src/archive-task.ts.
#
# daily-drift: Runs on schedule. Checks for spec drift (spec references code paths that
#   no longer exist; decision log entries reference PRs that were reverted). V1 will open
#   Issues for contradictions that block Tier 3 work.

name: Archivist

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"  # daily at 02:00 UTC

jobs:
  brief-validation:
    name: Brief Validation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run verify-brief
        id: verify_brief
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BRANCH: ${{ github.head_ref }}
        run: bun packages/aeg-core/bin/verify-brief.ts

      - name: Apply needs:brief-correction label on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr edit "${{ github.event.pull_request.number }}" --add-label "needs:brief-correction"

  post-merge:
    name: Post-Merge Archivist
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run archive-task
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_SHA: ${{ github.sha }}
        run: bun packages/aeg-core/bin/archive-task.ts

  daily-drift:
    name: Daily Drift Check (stub)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Stub — exits 0
        run: |
          echo "daily-drift V0.7 stub — drift check skipped"
          echo "V1 will detect spec/code divergence and open contradiction Issues"
          exit 0
