# Archivist
#
# brief-validation: Real, CI-enforced gate (D-069) — checks the PR body carries every
#   required brief section (Tier, For, Project, Test Plan, surface map, doc-update list, worktree
#   Step 0, stop conditions, autonomy clause, Closes #N, lock-ack). Blocks merge when
#   validation fails and applies `needs:brief-correction`. See
#   packages/aeg-core/src/brief-validation.ts.
#
# post-merge: Triggered after merge to main. Resolves the merge commit's PR, assembles
#   and posts the per-task Archivist provenance block, and explicitly closes the task's
#   Issue (D-056) — the mechanical close-out obligations from `roles/archivist.md` items
#   1 and 8. Idempotent per PR (skips if a provenance comment already exists) and skips
#   non-task branches. See packages/aeg-core/src/archive-task.ts.
#
# daily-drift: Runs on schedule (or manually via workflow_dispatch). Flags stuck
#   row-adjacent blockers: a task whose Issue has been open past a threshold while
#   a later topology row in the same iteration has not started. Never fails red —
#   a notification channel (label + idempotent tracking comment on the stuck
#   Issue), not a merge gate. Broader spec/code-divergence detection is a future
#   scope, not implemented here. See packages/aeg-core/src/stale-blocker.ts.

name: Archivist

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"  # daily at 02:00 UTC
  workflow_dispatch:

jobs:
  brief-validation:
    name: Brief Validation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run verify-brief
        id: verify_brief
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BRANCH: ${{ github.head_ref }}
        run: bun packages/aeg-core/bin/verify-brief.ts

      - name: Apply needs:brief-correction label on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr edit "${{ github.event.pull_request.number }}" --add-label "needs:brief-correction"

  post-merge:
    name: Post-Merge Archivist
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run archive-task
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_SHA: ${{ github.sha }}
        run: bun packages/aeg-core/bin/archive-task.ts

  daily-drift:
    name: Daily Drift Check (stuck row-adjacent blockers)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run stale-blocker
        continue-on-error: true # never-red — this job is a notification channel, not a gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun packages/aeg-core/bin/stale-blocker.ts
