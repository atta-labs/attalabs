# Vinaya Studio artifact producer.
#
# Builds `apps/vinaya-studio/web` (`next build`, `output: 'standalone'` — set
# in its own `next.config.ts`) and publishes the standalone bundle as a
# GitHub Release asset on a rolling `studio-standalone-latest` tag. This repo
# is PUBLIC, so the release asset is fetchable over plain HTTPS with no token
# — that is the whole point of the design: `atta-labs/vinaya`'s
# `bundle-studio.ts` fetches it at `prepack` time with no credential this
# repo would need to hand out.
#
# Hand-written, unlike the four `vinaya-*.yml` workflows in this directory —
# those are managed artifacts regenerated by `vinaya upgrade`, and `doctor`
# would not know what to make of a hand-written file among them. This one
# follows `ci.yml`'s convention instead (checkout/setup-bun/cache shape).
#
# Triggers on `workflow_dispatch` (manual re-publish / first bootstrap) and on
# every push to `main` that touches Studio's build inputs — the standalone
# output embeds `@atta/ui`, `@atta/cms`, `@atta/aeg-core`, `@atta/aeg-forge-state`,
# `@atta/instrumentation` (all `workspace:*`), so any of those changing is a
# reason to re-publish, not just a change under the app's own `src/`.
#
# The artifact is the raw `next build` output — `standalone/`, `static/`, and
# `public/` (only if the app actually has one; `apps/vinaya-studio/web` does
# not today) as three top-level tarball entries. Bundle ASSEMBLY (copying
# `static/`/`public/` into the standalone tree, renaming `node_modules` to
# `_node_modules` so npm/bun's packer doesn't strip it) stays the consumer's
# job in `bundle-studio.ts`, unchanged from what that script already did for
# a locally-built source tree — only where the raw build comes from moves.

name: Studio artifact

on:
  push:
    branches: [main]
    paths:
      - 'apps/vinaya-studio/web/**'
      - 'packages/ui/**'
      - 'packages/cms/**'
      - 'packages/aeg-core/**'
      - 'packages/aeg-forge-state/**'
      - 'packages/instrumentation/**'
      - '.github/workflows/vinaya-studio-artifact.yml'
  workflow_dispatch: {}

jobs:
  build-and-publish:
    name: Build standalone bundle and publish release artifact
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-studio-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            turbo-studio-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build apps/vinaya-studio/web (standalone)
        run: bun run build:vinaya-studio

      - name: Assemble artifact
        working-directory: apps/vinaya-studio/web
        run: |
          set -euo pipefail
          rm -rf /tmp/studio-artifact
          mkdir -p /tmp/studio-artifact
          cp -R .next/standalone /tmp/studio-artifact/standalone
          cp -R .next/static /tmp/studio-artifact/static
          if [ -d public ]; then
            cp -R public /tmp/studio-artifact/public
          fi
          tar -czf /tmp/studio-standalone.tar.gz -C /tmp/studio-artifact .
          du -sh /tmp/studio-standalone.tar.gz

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release delete studio-standalone-latest --yes --cleanup-tag || true
          gh release create studio-standalone-latest /tmp/studio-standalone.tar.gz \
            --title "Vinaya Studio standalone bundle (latest)" \
            --notes "Auto-published standalone Next.js build of apps/vinaya-studio/web at ${GITHUB_SHA}. Consumed by atta-labs/vinaya's bundle-studio.ts at CLI publish time. Not a versioned release — this tag is force-updated on every publishing push to main." \
            --target "${GITHUB_SHA}"
