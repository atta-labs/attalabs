name: Forge Lifecycle

# Two CI gates required by D-069:
#
#  closes-n-gate   — task-branch PRs must declare `Closes #N` in the body.
#                    Non-task branches bypass automatically.
#
#  coherence-gate  — stateless coherence oracle (verify-coherence.ts).
#                    A1/A2/A3/T1/T2/T3/D1/R1/N1/M1/M3 failures → CI red (the
#                    CLI's exit code is non-zero on ANY check with
#                    status:'fail' — see coherence-checks.ts for each check's
#                    exact fail/info semantics; several grandfather via
#                    COHERENCE_ENFORCED_FROM / R1_GRANDFATHERED_ISSUES).
#                    T2/T3 are scoped to the PR's own iteration in CI (via
#                    BRANCH below) — an unrelated iteration's topology gap
#                    never blocks this PR (aeg-governance-hardening task 19).
#                    L2/L3/N2/M2 are always info-only (never exit-1). NOTE:
#                    L1 is documented elsewhere as advisory but its current
#                    implementation returns status:'fail' like the checks
#                    above — a known pre-existing doc/code mismatch, not
#                    addressed by task 19 (see its PR body).
#                    On A1 failures the script's issue numbers receive
#                    the `aeg:incoherent` label via `gh issue edit`.
#
# Real substrate (private repo — branch protection unavailable on free plan):
#   CI turns red/green.  The T9 merge-gate hook (merged in #255) denies agent
#   merges of red-CI PRs.  Local hooks enforce the same rules for every writer.

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  closes-n-gate:
    name: Closes #N (task-branch PRs)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Closes #N
        env:
          BRANCH: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bun packages/aeg-core/bin/verify-coherence.ts --closes-n

  coherence-gate:
    name: Coherence oracle (A1/A2/A3 blocking)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run coherence oracle (JSON mode)
        id: oracle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.head_ref }}
        run: |
          set +e
          bun packages/aeg-core/bin/verify-coherence.ts --json > /tmp/coherence.json 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Apply aeg:incoherent label to A1 failures
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jq -r '[.checks[] | select(.check == "A1") | .failures[]?.issue | select(. != null)] | unique[]' \
            /tmp/coherence.json 2>/dev/null | while read -r num; do
            gh issue edit "$num" --add-label "aeg:incoherent" || true
          done

      - name: Report oracle findings
        if: steps.oracle.outputs.exit != '0'
        run: |
          echo "=== Coherence findings ==="
          jq '.checks[] | select(.status == "fail")' /tmp/coherence.json 2>/dev/null || \
            cat /tmp/coherence.json

      - name: Enforce coherence oracle result (blocking)
        if: always()
        run: exit ${{ steps.oracle.outputs.exit }}
