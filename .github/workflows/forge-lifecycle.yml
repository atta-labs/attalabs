name: Forge Lifecycle

# Two CI gates required by D-069:
#
#  closes-n-gate   — task-branch PRs must declare `Closes #N` in the body.
#                    Non-task branches bypass automatically.
#
#  coherence-gate  — stateless coherence oracle (verify-coherence.ts).
#                    A1/A2/A3/T1/T2/T3/D1/R1/N1/M1/M3 failures → CI red (the
#                    CLI's exit code is non-zero on ANY check with
#                    status:'fail' — see coherence-checks.ts for each check's
#                    exact fail/info semantics; several grandfather via
#                    COHERENCE_ENFORCED_FROM / R1_GRANDFATHERED_ISSUES).
#                    T2/T3 are scoped to the PR's own iteration in CI (via
#                    BRANCH below) — an unrelated iteration's topology gap
#                    never blocks this PR (aeg-governance-hardening task 19).
#                    L2/L3/N2/M2 are always info-only (never exit-1). NOTE:
#                    L1 is documented elsewhere as advisory but its current
#                    implementation returns status:'fail' like the checks
#                    above — a known pre-existing doc/code mismatch, not
#                    addressed by task 19 (see its PR body).
#                    On A1 failures the script's issue numbers receive
#                    the `aeg:incoherent` label via `gh issue edit`.
#                    T2 relocation (task 24, #364, Part 2 — D-082): T2 only
#                    blocks when PR_TOUCHED_FILES shows this PR's own diff
#                    touches a topology file (a plan PR) — otherwise T2's
#                    findings are demoted to info (never block a task PR).
#                    Repo-state reads (topology files, iteration list) come
#                    from a freshly-fetched origin/main via PR_HEAD_SHA/
#                    PR_TOUCHED_FILES, not the checkout's merge-ref, which
#                    GitHub materializes lazily and can lag behind main.
#
#  single-plan-pr-gate — ring-1 backstop for the single-plan-PR guard
#                    (aeg-governance-hardening task 24, #364, Part 1).
#                    `open-pr.ts`'s `checkSinglePlanPrGate` is ring-0
#                    prevention but only runs for PRs opened through that
#                    wrapper — a web-UI-opened PR bypasses it. This job
#                    re-runs the IDENTICAL predicate (`checkSinglePlanPr`,
#                    `@atta/aeg-core/src/single-plan-pr.ts`) forge-side. A
#                    no-op (exit 0) for any PR whose diff doesn't touch an
#                    iteration topology file — ordinary task-branch PRs never
#                    do, so this never fires for them (asserted in
#                    `verify-single-plan-pr.test.ts`).
#
# Real substrate (private repo — branch protection unavailable on free plan):
#   CI turns red/green.  The T9 merge-gate hook (merged in #255) denies agent
#   merges of red-CI PRs.  Local hooks enforce the same rules for every writer.

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  closes-n-gate:
    name: Closes #N (task-branch PRs)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Closes #N
        env:
          BRANCH: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bun packages/aeg-core/bin/verify-coherence.ts --closes-n

  coherence-gate:
    name: Coherence oracle (A1/A2/A3 blocking)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve this PR's touched files (item 5/T2 relocation — D-082)
        id: pr_files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files=$(gh pr view "${{ github.event.pull_request.number }}" --json files -q '.files[].path')
          {
            echo "files<<PR_FILES_EOF"
            echo "$files"
            echo "PR_FILES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run coherence oracle (JSON mode)
        id: oracle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.head_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TOUCHED_FILES: ${{ steps.pr_files.outputs.files }}
        run: |
          set +e
          bun packages/aeg-core/bin/verify-coherence.ts --json > /tmp/coherence.json 2>&1
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      - name: Apply aeg:incoherent label to A1 failures
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jq -r '[.checks[] | select(.check == "A1") | .failures[]?.issue | select(. != null)] | unique[]' \
            /tmp/coherence.json 2>/dev/null | while read -r num; do
            gh issue edit "$num" --add-label "aeg:incoherent" || true
          done

      - name: Report oracle findings
        if: steps.oracle.outputs.exit != '0'
        run: |
          echo "=== Coherence findings ==="
          jq '.checks[] | select(.status == "fail")' /tmp/coherence.json 2>/dev/null || \
            cat /tmp/coherence.json

      - name: Enforce coherence oracle result (blocking)
        if: always()
        run: exit ${{ steps.oracle.outputs.exit }}

  single-plan-pr-gate:
    name: Single-plan-PR guard (ring-1 backstop)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run single-plan-PR guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bun packages/aeg-core/bin/verify-single-plan-pr.ts
