name: "Vinaya: Review Gate (on verdict)"

# The issue_comment half of the review gate — split out of review-gate.yml
# (2026-08-08) for two reasons:
#
# 1. NOISE: while both halves lived in one file, every pull_request run
#    listed the two comment-path jobs as permanently "Skipped" on every
#    PR's checks panel — structural clutter (a job can never run on a
#    trigger its `if:` excludes, but GitHub still lists it per-run).
#    Separate file = separate workflow = pull_request runs no longer
#    mention these jobs at all.
#
# 2. FIFTH live-fire bug (2026-08-08, PR #803, run 31267378767): the
#    previous `report-check-run` job PATCHed/POSTed a check-run named
#    "Review gate" onto the PR's head SHA to propagate a verdict-comment
#    evaluation into the required check. GitHub's 2025-02-12 deprecation
#    ("Check run status and conclusions can only be updated internally by
#    GitHub Actions") is now enforced: the PATCH gets HTTP 403, so every
#    clean final verdict evaluated PASS in the log and then silently failed
#    to stamp — the required check stayed red until a human ran
#    `gh run rerun` by hand, every single time. The evaluation half of the
#    mechanism was proven live (runs fired 3s after each verdict comment,
#    judged correctly); only the propagation was dead.
#
# CURRENT DESIGN — propagate by re-running, not by writing:
# `retrigger` re-runs the most recent completed pull_request-event run of
# review-gate.yml for this PR's branch (`gh run rerun`, `actions: write`).
# That run re-executes the real required "Review gate" job, which fetches
# the PR's comments live and now sees the clean verdicts — the required
# check goes green NATIVELY, through the only channel the platform still
# permits (a workflow re-running a workflow). This is literally the manual
# rerun the Principal performed after every verdict, automated. Cost: one
# re-executed job (~30s) per gate-flipping verdict; the required check
# briefly shows queued/in-progress again before concluding.
#
# PRIVILEGE SPLIT (inherited from review-gate.yml's "Third live-fire bug" —
# read that header; its reasoning is unchanged here): `evaluate_on_comment`
# checks out and executes PR-branch content (`verify-review-gate.ts`) and
# therefore holds NO write permission of any kind. `retrigger` holds
# `actions: write` but checks out and executes NOTHING — its only inputs
# are the evaluator's job outputs (number/branch), which the evaluator
# resolved via a live `gh pr view` before ever touching PR content. A
# malicious PR branch can therefore at worst make its own evaluation fail —
# it can never reach the rerun credential, and a rerun only ever re-executes
# the same required job any push already triggers (no privilege gained).
#
# `retrigger` fires ONLY on `evaluate_on_comment` success: a failed
# evaluation (verdict missing / REQUEST CHANGES) leaves the existing red
# check standing — re-running on failure would spend CI to re-conclude the
# same red. The `if:` comment filter (body must contain "VERDICT") keeps
# ordinary PR chat from spending a billed minute; a repo-wide comment on a
# plain Issue short-circuits on `issue.pull_request == null`.
#
# issue_comment payloads carry no head SHA/branch — the first step resolves
# both via `gh pr view`, and checkout pins to that resolved SHA (the
# event's default ref would be the default branch, not the PR head). See
# review-gate.yml's header for the full four-bug history that shaped this.

on:
  issue_comment:
    types: [created]

jobs:
  evaluate_on_comment:
    name: Review gate (verdict check)
    if: github.event.issue.pull_request != null && contains(github.event.comment.body, 'VERDICT')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      # issues: read — fetchWaiverLabelActor needs the issues-scoped
      # timeline endpoint for the vinaya/waiver:review actor check (see
      # review-gate.yml's identical grant and the PR #489 finding).
      issues: read
      # Deliberately NO write permission of any kind — this job executes
      # PR-branch content. See header, "PRIVILEGE SPLIT".
    outputs:
      number: ${{ steps.pr.outputs.number }}
      branch: ${{ steps.pr.outputs.branch }}
      sha: ${{ steps.pr.outputs.sha }}
    steps:
      - name: Resolve PR number, branch, and head SHA
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NUMBER="${{ github.event.issue.number }}"
          BRANCH=$(gh pr view "$NUMBER" --repo "${{ github.repository }}" --json headRefName -q .headRefName)
          SHA=$(gh pr view "$NUMBER" --repo "${{ github.repository }}" --json headRefOid -q .headRefOid)
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.sha }}
          # This job executes PR-branch content; don't leave the (read-only,
          # ephemeral) token in .git/config for postinstalls to read.
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Review gate (code-reviewer + security-review verdicts)
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.pr.outputs.branch }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: bun packages/aeg-core/bin/verify-review-gate.ts

  # Executes nothing; consumes only the evaluator's outputs. See header,
  # "CURRENT DESIGN" and "PRIVILEGE SPLIT".
  retrigger:
    name: Review gate (retrigger)
    if: needs.evaluate_on_comment.result == 'success'
    needs: evaluate_on_comment
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-run the required Review gate run for this branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ needs.evaluate_on_comment.outputs.branch }}
        run: |
          # Most recent COMPLETED pull_request-event run of the required
          # workflow on this branch. In-progress runs are excluded (rerun
          # would 409). Residual race, named honestly: an in-flight run may
          # have fetched comments BEFORE the verdict landed and conclude
          # red; this job then reruns an older completed run or nothing.
          # Narrow window (this job's own checkout/install usually outlasts
          # the in-flight run), and every outcome degrades to the prior
          # status quo — a standing red plus one manual rerun — never a
          # wrong green.
          RUN_ID=$(gh run list --repo "${{ github.repository }}" \
            --workflow review-gate.yml --branch "$BRANCH" \
            --status completed \
            --json databaseId,event \
            --jq '[.[] | select(.event=="pull_request")][0].databaseId // empty')

          if [ -z "$RUN_ID" ]; then
            echo "No completed pull_request-event Review Gate run found for branch $BRANCH — nothing to re-run (a live run may already be evaluating)."
            exit 0
          fi

          echo "Re-running Review Gate run $RUN_ID for branch $BRANCH"
          gh run rerun "$RUN_ID" --repo "${{ github.repository }}"
