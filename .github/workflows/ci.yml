# CI — typecheck + unit tests (D-078, ring 1).
#
# The ring-1 backstop for what pre-commit enforces at ring 0. Until this
# workflow existed, no CI job ran typecheck or any unit tests — state-machine
# §12's "Typecheck, tests — standard CI gates; always blocking" was
# aspirational: a writer bypassing local hooks (--no-verify, GitHub UI, any
# non-hooked tool) could merge untested code with only Vercel's app builds as
# an indirect net. Notably, packages/aeg-core's test suite — the tests
# guarding every enforcement gate — ran nowhere automatically.
#
# Scopes (deliberate, no silent caps — D-074 discipline):
#   - Both steps use `turbo --affected`, which scopes to packages changed
#     between this branch and `main` PLUS every transitive dependent (turbo
#     computes the dependency graph, not just changed files) — so a change to
#     a shared package (e.g. @atta/engine) still tests every package that
#     depends on it, directly or indirectly. Same gates, same strictness;
#     scoping only decides how much runs, never what counts as passing.
#   - A doc/workflow-only PR (nothing under any package) now runs 0 packages
#     and completes near-instantly. This is sound, not a gap: repo-file gates
#     (verify-docs, coherence, etc.) run in their own separate CI jobs
#     regardless of what this job decides to test.
#   - Typecheck additionally scopes to ./packages/* only. App typecheck
#     requires the CMS `generate` step (Sanity tokens live in uncommitted
#     .env files, absent in CI); apps are type-checked by their Vercel
#     production builds (ring 1) and by the full `turbo typecheck` in
#     pre-commit (ring 0).
#   - Checkout uses fetch-depth: 0 (full history) so `--affected` can resolve
#     a merge-base against `main` — a shallow clone breaks that ref
#     resolution. `.turbo` and `~/.bun/install/cache` are cached between runs,
#     keyed on bun.lock's hash.
#   - TURBO_SCM_BASE=origin/main is required alongside fetch-depth: 0, not
#     instead of it: a GitHub Actions checkout has full history but no local
#     branch literally named `main`, only `origin/main` — confirmed failing
#     in real CI without this (`ambiguous argument 'main'`, silently falling
#     back to testing every package, task 27's own PR #397).
#
# Enforcement substrate as everywhere: CI red + the T9 merge-gate hook.

name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  typecheck-and-tests:
    name: Typecheck + unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    env:
      # GH_TOKEN (aeg-forge-state-v1 3b, #437): @atta/aeg-core's test suite
      # now exercises the coherence oracle's forge-derived tranche read
      # (verify-coherence.test.ts's CLI subprocess test, plus the new
      # golden-comparison test) — both shell out to `gh`, which needs a
      # token to authenticate on a fresh Actions runner. Without it, every
      # per-tranche forge call fails and falls back to the file read
      # (still correct, per loadTrancheFiles' own fallback), but the
      # golden comparison then only proves file-equals-file, not
      # forge-equals-file — this token is what makes it a real proof in CI.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # A GitHub Actions checkout has no local branch literally named
      # `main` — only `origin/main` — so `--affected` can't resolve `main`
      # on its own (confirmed failing in real CI: "ambiguous argument
      # 'main'", silently falling back to "assume everything changed").
      # This is turbo's own documented env var for pointing it at the
      # right ref.
      TURBO_SCM_BASE: origin/main
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Cache turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (packages affected by this PR's diff)
        run: bunx turbo typecheck --affected --filter='./packages/*'

      - name: Unit tests (affected packages)
        run: bunx turbo test --affected
