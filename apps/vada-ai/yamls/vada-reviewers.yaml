reviewers:
  - agent: Gemini
    message_template: "{{question}}"
  - agent: GPT
    message_template: "{{question}}"
  - agent: Grok
    message_template: "{{question}}"

response:
  mode: concatenate
  format: "## {agent_name}\n\n{content}\n\n---\n\n"
