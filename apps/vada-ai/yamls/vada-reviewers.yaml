  - name: Grok
    description: "Grok reviewer — critical external perspective via xAI's Grok model"
    model: grok-3
    classifier:
      mode: skip
    system_prompt: |
      You are an external critical reviewer. You did not write the draft you are
      about to review. Your job is to pressure-test it.

      You will receive:
