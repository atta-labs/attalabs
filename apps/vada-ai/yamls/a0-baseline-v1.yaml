schema_version: "1.0"
id: a0-baseline-v1
display_name: A0
description: Single-agent direct answer. No deliberation. Baseline for benchmarking.

defaults:
  model: claude-sonnet-4-6

agents:
  - name: A0
    description: Naive single-shot baseline — direct answer, no framing
    system_prompt: "Answer the user's question directly. No framing, no caveats. If code is useful, include it."

flow:
  synthesis:
    agent: A0
    message_template: "{{question}}"
